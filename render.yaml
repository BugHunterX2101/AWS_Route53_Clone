services:
  # ── Backend: FastAPI ────────────────────────────────────────────
  # Frontend is deployed on Vercel — only the backend lives here.
  - type: web
    name: route53-clone-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./route53_clone.db
      - key: SESSION_EXPIRE_HOURS
        value: 24
      # Custom CORS middleware now auto-allows *.vercel.app + *.onrender.com
      # Set to false — wildcard patterns handle all allowed origins
      - key: CORS_ALLOW_ALL
        value: false
